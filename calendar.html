<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#6b4f36" />
  <title>BREWS.CO – History</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dialog.css">
  <script src="js/theme.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/header.js"></script>
  <link rel="stylesheet" href="css/calendar.css">
</head>
<body class="has-bottom-nav">
<div class="container">

  <div id="calSyncToast"></div>
  <div class="offline-pill" id="calOfflinePill">📡 Offline — changes save locally</div>

  <div id="calHeaderRoot"></div>
  <script>
    document.getElementById("calHeaderRoot").innerHTML = renderPageHeader({
      subtitle: "History",
      extraButtonsHTML: `
        <button class="export-csv-btn" id="calExportBtn" onclick="exportHistoryCSV()" style="display:none;">📊 Export CSV</button>
        <button class="pull-cloud-btn" id="calPullBtn" onclick="calPullFromCloud()" style="display:none;">⬇️ Pull Cloud</button>
        <button class="delete-all-btn" onclick="deleteAllHistory()">🗑 Delete All</button>
      `
    });
  </script>

  <div class="month-nav">
    <button onclick="changeMonth(-1)">&#8592;</button>
    <h2 id="monthTitle"></h2>
    <button onclick="changeMonth(1)">&#8594;</button>
  </div>

  <div class="cal-wrapper">
    <table class="calendar" id="calendarTable">
      <thead>
        <tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
          <th>Thu</th><th>Fri</th><th>Sat</th>
          <th class="week-col">Week</th>
        </tr>
      </thead>
      <tbody id="calendarBody"></tbody>
    </table>
  </div>
  <div style="display:flex;gap:14px;padding:4px 2px 2px;font-size:0.72rem;color:var(--bark);">
    <span style="display:flex;align-items:center;gap:5px;">
      <span style="width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--clay-light),var(--clay-dark));display:inline-block;"></span> Inventory saved
    </span>
    <span style="display:flex;align-items:center;gap:5px;">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--success-mid);display:inline-block;"></span> Order log saved
    </span>
  </div>

  <div class="section monthly-exp-section">
    <h3>Monthly Expenses</h3>
    <div id="monthlyExpContainer"></div>
    <button class="add-expense-btn" onclick="addMonthlyExpRow()">+ Add Monthly Expense</button>
  </div>

  <div class="monthly-summary" id="monthlySummary"></div>

  <div class="popular-flavors" id="popularFlavors"></div>

  <!-- Retention Settings -->
  <div class="section retention-section">
    <h3>Order Log Retention</h3>
    <p class="retention-desc">Saved shift orders auto-delete after a set period. Choose how long to keep them:</p>
    <div class="retention-pills" id="retentionPills"></div>
    <p class="retention-note" id="retentionNote"></p>
  </div>

  <!-- Saved Order Logs -->
  <div class="section order-logs-section">
    <h3>Saved Order Logs</h3>
    <div id="orderLogsContainer"></div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalDate">
    <div class="modal-header">
      <h3 id="modalDate"></h3>
      <div class="modal-header-actions">
        <button class="modal-delete-btn" onclick="deleteCurrentEntry()">🗑 Delete</button>
        <button class="modal-close" onclick="closeModal()">✕ Close</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/history.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="console.warn('Firebase CDN unavailable')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="console.warn('Firebase CDN unavailable')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="console.warn('Firebase CDN unavailable')"></script>
<script>
  if (typeof window.syncPull      !== "function") window.syncPull      = async () => { throw new Error("Sync unavailable"); };
</script>
<script src="js/sync.js" onerror="console.warn('sync.js not found')"></script>
<script src="js/pages/calendar.js"></script>

<script>document.write(renderBottomNav("history", {
  variant: getDeviceRole() === "manager" ? "manager" : "worker"
}));</script>
<script>
  applyBottomNavRole();
  const _nav = performance.getEntriesByType('navigation')[0];
  if (_nav && _nav.type === 'reload' && !localStorage.getItem('brewsShiftActive')) {
    window.location.replace('index.html');
  }
</script>
<script src="js/ui/sw-register.js"></script>
</body>
</html>
